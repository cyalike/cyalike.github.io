<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>地圖測試</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont; }
    .top { padding: 12px 16px; border-bottom: 1px solid #ddd; font-weight: 700; }
    #status { padding: 10px 16px; color: #444; }
    #map { height: 70vh; background: #e5e7eb; }
  </style>
</head>
<body>
  <div class="top">🍜 地圖測試（如果這頁都沒地圖，就不是你的程式問題）</div>
  <div id="status">載入中…</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    window.addEventListener("load", () => {
      const status = document.getElementById("status");

      if (!window.L) {
        status.textContent = "❌ Leaflet 沒有載到（外部連結被擋 or 沒成功載入）";
        return;
      }

      status.textContent = "✅ Leaflet 已載到，正在畫地圖…";

      const map = L.map("map").setView([25.033, 121.5654], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19
      }).addTo(map);

      L.marker([25.033, 121.5654]).addTo(map).bindPopup("地圖正常").openPopup();
      status.textContent = "✅ 地圖正常（看到這行＋看到地圖＝OK）";
    });
  </script>
</body>
</html>
